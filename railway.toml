# railway.toml para el servicio BACKEND (raíz del repo)
# Si estás creando el servicio de FRONTEND, en Railway UI ve a:
#   Settings → Build → Root Directory → "frontend"
# y este archivo será ignorado; usará frontend/railway.toml en su lugar.

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm ci && npm run build"

[deploy]
startCommand = "cd backend && node dist/main"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
